name: Build procurement intelligence outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python src/analyze.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed outputs
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Refresh procurement intelligence outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

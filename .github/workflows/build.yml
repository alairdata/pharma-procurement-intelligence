name: Procurement intelligence pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/pipeline/**"
      - "src/__init__.py"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: procurement-intelligence-pipeline
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quality unit tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run procurement intelligence pipeline
        env:
          PYTHONPATH: .
        run: python -m src.pipeline.run

      - name: Publish state, staging, marts and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state data/staging data/marts data/warehouse/warehouse_manifest.json outputs
          if git diff --cached --quiet; then
            echo "No pipeline output changes"
          else
            git commit -m "Refresh procurement intelligence pipeline outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
